name: Validate website

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the existing GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Save the site for preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site/
          retention-days: 7
